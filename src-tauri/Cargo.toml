[package]
name = "geocarto"
version = "0.2.0"
description = "GeoCarto — a visual-first cartography app"
authors = ["Kilian Vivien"]
edition = "2021"
rust-version = "1.77.2"

# The library is what Tauri's mobile/desktop entrypoints link against; main.rs
# is a thin shim that calls into it. Keeping the logic in a lib lets the same
# code back a future mobile target without duplication.
[lib]
name = "geocarto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` backs the transparent window + native vibrancy (windowEffects)
# configured in tauri.conf.json. Note: it relies on a private macOS API, which
# makes the build ineligible for the Mac App Store — fine while distribution is
# direct (.dmg); revisit if App Store submission becomes a goal.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"

[features]
# Used by `tauri dev`/`tauri build` to enable custom-protocol asset serving.
custom-protocol = ["tauri/custom-protocol"]
