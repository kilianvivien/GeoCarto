<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoCarto</title>
    <script>
      (function () {
        // Tauri injects __TAURI_INTERNALS__ before the bundle loads. Mark the
        // root element synchronously so the desktop chrome (transparent body for
        // native vibrancy, traffic-light clearance) applies without a flash.
        if ('__TAURI_INTERNALS__' in window) {
          document.documentElement.setAttribute('data-tauri', '');
        }
        try {
          var saved = localStorage.getItem('geocarto-theme');
          if (saved) {
            document.documentElement.setAttribute('data-theme', saved);
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          /* sandboxed: keep the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
